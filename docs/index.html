<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Repo · Unitama Sari Mas</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --line: #e4e3df;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8983;
    --series: #2a78d6; --good: #008300; --warn: #b87a00; --bad: #e34948;
  }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --card: #222221; --line: #3a3a38;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --series: #3987e5; --good: #0ca30c; --warn: #c98500; --bad: #e66767;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --card: #222221; --line: #3a3a38;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --series: #3987e5; --good: #0ca30c; --warn: #c98500; --bad: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 24px; margin: 0 0 2px; }
  .sub { color: var(--ink-2); font-size: 13px; }
  button, select, input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .v { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .l { color: var(--ink-2); font-size: 13px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .bars { display: grid; gap: 6px; position: relative; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 44px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .bar-row .t { height: 12px; }
  .bar-row .f { height: 12px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row .c { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row:hover .f { filter: brightness(1.15); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters input { flex: 1; min-width: 180px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; }
  th[aria-sort="ascending"]::after { content: " ▲"; font-size: 10px; }
  th[aria-sort="descending"]::after { content: " ▼"; font-size: 10px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.desc { white-space: normal; color: var(--ink-2); min-width: 220px; max-width: 360px; }
  a { color: var(--series); text-decoration: none; font-weight: 600; } a:hover { text-decoration: underline; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); }
  .chip i { font-style: normal; font-weight: 700; }
  .good i { color: var(--good); } .warn i { color: var(--warn); } .bad i { color: var(--bad); } .mute i { color: var(--ink-3); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--ink-3); }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; opacity: 0; transition: opacity .1s; z-index: 5; }
  .banner { background: var(--card); border: 1px dashed var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; display: none; }
  .empty { padding: 24px; text-align: center; color: var(--ink-2); }
  footer { color: var(--ink-3); font-size: 12.5px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Dashboard Repo</h1>
      <div class="sub" id="updated">Memuat data…</div>
    </div>
    <button id="theme" type="button" aria-label="Ganti tema">Tema</button>
  </header>

  <div class="banner" id="demo">Mode contoh: data di bawah hanya sampel. Data asli muncul setelah workflow <b>Monitor repo organisasi</b> berjalan.</div>

  <section class="tiles" id="tiles" aria-label="Ringkasan"></section>

  <section class="panel">
    <h2>Commit 30 hari terakhir (10 teratas)</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel">
    <h2>Semua repo</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="Cari nama atau deskripsi…" aria-label="Cari repo">
      <select id="fh" aria-label="Filter status"><option value="">Semua status</option><option value="active">Aktif</option><option value="slow">Lambat</option><option value="stale">Stagnan</option><option value="archived">Arsip</option></select>
      <select id="fl" aria-label="Filter bahasa"><option value="">Semua bahasa</option></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>
  <footer>Data diperbarui otomatis oleh GitHub Actions. Hanya repo publik ditampilkan kecuali dikonfigurasi lain.</footer>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = (s) => document.querySelector(s);
const HEALTH = { active: ['good', '●', 'Aktif'], slow: ['warn', '◆', 'Lambat'], stale: ['bad', '▲', 'Stagnan'], archived: ['mute', '■', 'Arsip'] };
const CI = { pass: ['good', '✓', 'Lulus'], fail: ['bad', '✕', 'Gagal'], pending: ['warn', '…', 'Berjalan'], none: ['mute', '–', 'Tidak ada'] };
const COLS = [
  ['name', 'Repo'], ['description', 'Deskripsi'], ['language', 'Bahasa'], ['commits30d', 'Commit 30h', 1],
  ['openIssues', 'Issue', 1], ['openPRs', 'PR', 1], ['stars', '★', 1], ['ci', 'CI'], ['health', 'Status'], ['pushedAt', 'Push terakhir'],
];
let data, sortKey = 'commits30d', sortDir = -1;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chip = (map, k) => { const [c, i, t] = map[k]; return `<span class="chip ${c}"><i aria-hidden="true">${i}</i>${t}</span>`; };
const ago = (iso) => { const d = Math.floor((Date.now() - new Date(iso)) / 864e5); return d <= 0 ? 'hari ini' : d + ' hari lalu'; };

function demoData() {
  const mk = (name, description, language, commits30d, openIssues, openPRs, stars, ci, health, days) => ({
    name, description, language, languageColor: null, commits30d, openIssues, openPRs, stars, forks: 0, ci, health,
    url: '#', private: false, pushedAt: new Date(Date.now() - days * 864e5).toISOString(),
  });
  const repos = [
    mk('contoh-backoffice', 'Sampel: aplikasi backoffice', 'PHP', 42, 6, 2, 3, 'pass', 'active', 1),
    mk('contoh-api', 'Sampel: API layanan data', 'PHP', 31, 3, 1, 1, 'pass', 'active', 2),
    mk('contoh-tms', 'Sampel: manajemen transportasi', 'JavaScript', 24, 9, 4, 0, 'fail', 'active', 4),
    mk('contoh-ai', 'Sampel: eksperimen AI internal', 'Python', 11, 2, 0, 2, 'pending', 'active', 9),
    mk('contoh-erp', 'Sampel: ERP', 'PHP', 4, 12, 3, 0, 'none', 'slow', 47),
    mk('contoh-lama', 'Sampel: repo lama', 'Shell', 0, 1, 0, 0, 'none', 'stale', 210),
  ];
  const sum = (k) => repos.reduce((a, r) => a + r[k], 0);
  return { org: 'Unitama-Sari-Mas', generatedAt: new Date().toISOString(), repos, totals: {
    repos: repos.length, active: repos.filter((r) => r.health === 'active').length, stale: 1,
    commits30d: sum('commits30d'), openIssues: sum('openIssues'), openPRs: sum('openPRs'), ciFailing: 1 } };
}

async function load() {
  const demo = new URLSearchParams(location.search).has('demo');
  if (demo) return [demoData(), true];
  try {
    const r = await fetch('data/repos.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    return [await r.json(), false];
  } catch { return [demoData(), true]; }
}

function tiles(t) {
  const items = [['Repo', t.repos], ['Aktif (30 hari)', t.active], ['Commit 30 hari', t.commits30d], ['Issue terbuka', t.openIssues], ['PR terbuka', t.openPRs], ['CI gagal', t.ciFailing]];
  $('#tiles').innerHTML = items.map(([l, v]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

function bars(repos) {
  const top = [...repos].sort((a, b) => b.commits30d - a.commits30d).slice(0, 10);
  const max = Math.max(1, ...top.map((r) => r.commits30d));
  $('#bars').innerHTML = top.map((r) => `<div class="bar-row" data-tip="${esc(r.name)}: ${r.commits30d} commit">
    <div class="n" title="${esc(r.name)}">${esc(r.name)}</div>
    <div class="t"><div class="f" style="width:${(r.commits30d / max) * 100}%"></div></div>
    <div class="c">${r.commits30d}</div></div>`).join('') || '<div class="empty">Belum ada data.</div>';
}

function head() {
  $('#head').innerHTML = COLS.map(([k, l, n]) =>
    `<th data-k="${k}" class="${n ? 'num' : ''}" tabindex="0" aria-sort="${k === sortKey ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'}">${l}</th>`).join('');
}

function render() {
  const q = $('#q').value.toLowerCase(), fh = $('#fh').value, fl = $('#fl').value;
  const rows = data.repos.filter((r) =>
    (!q || (r.name + ' ' + r.description).toLowerCase().includes(q)) && (!fh || r.health === fh) && (!fl || r.language === fl))
    .sort((a, b) => {
      const x = a[sortKey] ?? '', y = b[sortKey] ?? '';
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir;
    });
  $('#body').innerHTML = rows.map((r) => `<tr>
    <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>${r.private ? ' 🔒' : ''}</td>
    <td class="desc">${esc(r.description) || '—'}</td>
    <td>${r.language ? `<span class="dot" style="${r.languageColor ? 'background:' + esc(r.languageColor) : ''}"></span>${esc(r.language)}` : '—'}</td>
    <td class="num">${r.commits30d}</td><td class="num">${r.openIssues}</td><td class="num">${r.openPRs}</td><td class="num">${r.stars}</td>
    <td>${chip(CI, r.ci)}</td><td>${chip(HEALTH, r.health)}</td><td>${ago(r.pushedAt)}</td></tr>`).join('')
    || `<tr><td colspan="${COLS.length}" class="empty">Tidak ada repo yang cocok.</td></tr>`;
  head();
}

function sortBy(k) { sortDir = k === sortKey ? -sortDir : (['name', 'description', 'language'].includes(k) ? 1 : -1); sortKey = k; render(); }

(async () => {
  let demo; [data, demo] = await load();
  $('#title').textContent = `Dashboard Repo · ${data.org}`;
  $('#updated').textContent = 'Diperbarui ' + new Intl.DateTimeFormat('id-ID', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Asia/Jakarta' }).format(new Date(data.generatedAt)) + ' WIB';
  if (demo) $('#demo').style.display = 'block';
  tiles(data.totals); bars(data.repos);
  [...new Set(data.repos.map((r) => r.language).filter(Boolean))].sort().forEach((l) => $('#fl').insertAdjacentHTML('beforeend', `<option>${esc(l)}</option>`));
  render();
  $('#head').addEventListener('click', (e) => e.target.dataset.k && sortBy(e.target.dataset.k));
  $('#head').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.k) { e.preventDefault(); sortBy(e.target.dataset.k); } });
  ['#q', '#fh', '#fl'].forEach((s) => $(s).addEventListener('input', render));
})();

// Tooltip batang
const tip = $('#tip');
$('#bars').addEventListener('mousemove', (e) => {
  const row = e.target.closest('.bar-row'); if (!row) { tip.style.opacity = 0; return; }
  tip.textContent = row.dataset.tip; tip.style.opacity = 1; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px';
});
$('#bars').addEventListener('mouseleave', () => (tip.style.opacity = 0));

// Tema
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
});
</script>
</body>
</html>
