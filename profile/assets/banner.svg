<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Unitama Sari Mas Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12264a"/>
      <stop offset="1" stop-color="#1b4fa8">
        <animate attributeName="stop-color" values="#1b4fa8;#0f7a6b;#1b4fa8" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <g fill="none" stroke="#7cc4ff" stroke-opacity="0.35" stroke-width="2">
    <polyline points="640,230 720,190 800,205 880,140 960,160 1040,90 1120,110">
      <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </polyline>
  </g>
  <g fill="#7cc4ff">
    <circle cx="720" cy="190" r="5"/><circle cx="880" cy="140" r="5"/><circle cx="1040" cy="90" r="5"/>
  </g>
  <text x="70" y="130" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1">Unitama Sari Mas</text>
  <text x="72" y="178" fill="#a9c7ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Engineering · Sistem Internal · Distribusi</text>
  <rect x="72" y="205" width="150" height="4" rx="2" fill="#7cc4ff"/>
</svg>
