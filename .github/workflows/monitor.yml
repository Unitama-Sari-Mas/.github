name: Monitor repo organisasi

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/monitor.mjs', '.github/workflows/monitor.yml']

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tarik data & perbarui README
        env:
          ORG: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.ORG_MONITOR_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: 'false'
        run: node scripts/monitor.mjs

      - name: Commit jika ada perubahan
        run: |
          git config user.name  "org-monitor[bot]"
          git config user.email "org-monitor[bot]@users.noreply.github.com"
          git add profile/README.md docs/data/repos.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore(monitor): perbarui statistik repo"
            git push
          fi
